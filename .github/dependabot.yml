version: 2
updates:
  - package-ecosystem: bun
    directory: /gateway
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
