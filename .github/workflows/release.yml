name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
          no-cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck
      - name: Pull pinned synthetic mail fixture
        run: |
          source ./scripts/synthetic-fixture.sh
          docker pull "$SYNTHETIC_MAIL_IMAGE"
      - name: Require independently verified exact SHA
        env:
          VERIFIED_SHA: ${{ vars.VERIFIED_SHA }}
        run: |
          test -n "$VERIFIED_SHA"
          test "$VERIFIED_SHA" = "$(git rev-parse HEAD)"
      - name: Verify release candidate
        run: |
          ./scripts/verify-public-release.sh
          ./scripts/quickstart.integration.test.sh
          ./scripts/verify-release-history.sh "$GITHUB_REF_NAME"
          cd gateway && bun audit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
