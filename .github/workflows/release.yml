name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Pull pinned synthetic mail fixture
        run: docker pull greenmail/standalone:2.1.9
      - name: Require independently verified exact SHA
        env:
          VERIFIED_SHA: ${{ vars.VERIFIED_SHA }}
        run: |
          test -n "$VERIFIED_SHA"
          test "$VERIFIED_SHA" = "$(git rev-parse HEAD)"
      - name: Verify release candidate
        run: |
          ./scripts/verify.sh
          ./scripts/verify-public-release.sh
          ./scripts/verify-integration.sh
          ./scripts/verify-release-history.sh "$GITHUB_REF_NAME"
          cd gateway && bun audit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
