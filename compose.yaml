name: giggabit-agent-mail-service-synthetic
services:
  mail:
    image: ${SYNTHETIC_MAIL_IMAGE}
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test1:pwd1@localhost
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/3025' && timeout 1 bash -c '</dev/tcp/127.0.0.1/3143'"]
      interval: 1s
      timeout: 2s
      retries: 30
    restart: "no"
